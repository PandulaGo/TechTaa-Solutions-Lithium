<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="frontendGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#6d28d9"/>
    </linearGradient>
    <linearGradient id="backendGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#047857"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d97706"/>
      <stop offset="100%" style="stop-color:#b45309"/>
    </linearGradient>
    <linearGradient id="externalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowWhite" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/>
    </marker>
    <marker id="arrowYellow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="600" y="45" text-anchor="middle" fill="#f8fafc" font-size="28" font-weight="700">Lithium — Application Architecture</text>
  <text x="600" y="70" text-anchor="middle" fill="#94a3b8" font-size="14">API Testing &amp; Monitoring Platform</text>

  <!-- ==================== FRONTEND SECTION ==================== -->
  <g filter="url(#shadow)">
    <rect x="30" y="100" width="520" height="520" rx="16" fill="#1e1b4b" stroke="#7c3aed" stroke-width="2" opacity="0.95"/>
  </g>
  <rect x="30" y="100" width="520" height="44" rx="16" fill="url(#frontendGrad)"/>
  <rect x="30" y="128" width="520" height="16" fill="url(#frontendGrad)"/>
  <text x="290" y="128" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">FRONTEND — React + TypeScript + Vite</text>
  <text x="290" y="155" text-anchor="middle" fill="#a78bfa" font-size="11">Port 10025 | Tailwind CSS | React Router v6</text>

  <!-- Pages -->
  <rect x="50" y="170" width="230" height="200" rx="10" fill="#312e81" stroke="#4f46e5" stroke-width="1" opacity="0.8"/>
  <text x="165" y="192" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="600">PAGES</text>
  <text x="70" y="215" fill="#e0e7ff" font-size="11">◉  DashboardPage</text>
  <text x="70" y="235" fill="#e0e7ff" font-size="11">⬡  EndpointsPage</text>
  <text x="70" y="255" fill="#e0e7ff" font-size="11">◷  SchedulesPage</text>
  <text x="70" y="275" fill="#e0e7ff" font-size="11">✓  ValidationRulesPage</text>
  <text x="70" y="295" fill="#e0e7ff" font-size="11">☰  ResultsPage</text>
  <text x="70" y="315" fill="#e0e7ff" font-size="11">⇅  ExportImportPage</text>
  <text x="70" y="335" fill="#e0e7ff" font-size="11">?  ReferencePage</text>
  <text x="70" y="358" fill="#94a3b8" font-size="9" font-style="italic">7 routes via React Router</text>

  <!-- Components -->
  <rect x="300" y="170" width="230" height="120" rx="10" fill="#312e81" stroke="#4f46e5" stroke-width="1" opacity="0.8"/>
  <text x="415" y="192" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="600">COMPONENTS</text>
  <text x="320" y="215" fill="#e0e7ff" font-size="11">KeyValueEditor — Headers</text>
  <text x="320" y="235" fill="#e0e7ff" font-size="11">Spinner — Loading states</text>
  <text x="320" y="255" fill="#e0e7ff" font-size="11">ConfirmDialog — Modals</text>
  <text x="320" y="275" fill="#e0e7ff" font-size="11">MethodBadge / StatusCodeBadge</text>

  <!-- Contexts -->
  <rect x="300" y="300" width="230" height="70" rx="10" fill="#312e81" stroke="#4f46e5" stroke-width="1" opacity="0.8"/>
  <text x="415" y="322" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="600">CONTEXTS</text>
  <text x="320" y="345" fill="#e0e7ff" font-size="11">ThemeContext (Light/Dark)</text>
  <text x="320" y="362" fill="#e0e7ff" font-size="11">ToastContext (Notifications)</text>

  <!-- API Client -->
  <rect x="50" y="385" width="480" height="55" rx="10" fill="#312e81" stroke="#4f46e5" stroke-width="1" opacity="0.8"/>
  <text x="290" y="407" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="600">API CLIENT LAYER</text>
  <text x="290" y="427" text-anchor="middle" fill="#e0e7ff" font-size="11">services/api.ts — fetch() wrapper | API_BASE = '/api' | JSON content-type</text>

  <!-- Vite Proxy -->
  <rect x="50" y="455" width="480" height="50" rx="10" fill="#3b0764" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="290" y="477" text-anchor="middle" fill="#d8b4fe" font-size="12" font-weight="600">VITE DEV SERVER</text>
  <text x="290" y="494" text-anchor="middle" fill="#e9d5ff" font-size="10">Proxy: /api/* → http://localhost:10021 | HMR enabled</text>

  <!-- State Management -->
  <rect x="50" y="520" width="480" height="45" rx="10" fill="#312e81" stroke="#4f46e5" stroke-width="1" opacity="0.8"/>
  <text x="290" y="542" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="600">STATE MANAGEMENT</text>
  <text x="290" y="557" text-anchor="middle" fill="#e0e7ff" font-size="10">React useState + useEffect | Polling (Dashboard 5s interval) | No external state library</text>

  <!-- Types -->
  <rect x="50" y="578" width="480" height="30" rx="8" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" opacity="0.6"/>
  <text x="290" y="598" text-anchor="middle" fill="#818cf8" font-size="10">types/index.ts — ApiEndpoint | Collection | Schedule | ApiResult | ValidationRule | DashboardStats</text>

  <!-- ==================== BACKEND SECTION ==================== -->
  <g filter="url(#shadow)">
    <rect x="600" y="100" width="570" height="520" rx="16" fill="#022c22" stroke="#059669" stroke-width="2" opacity="0.95"/>
  </g>
  <rect x="600" y="100" width="570" height="44" rx="16" fill="url(#backendGrad)"/>
  <rect x="600" y="128" width="570" height="16" fill="url(#backendGrad)"/>
  <text x="885" y="128" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">BACKEND — Express + Node.js + TypeScript</text>
  <text x="885" y="155" text-anchor="middle" fill="#6ee7b7" font-size="11">Port 10021 | CORS enabled | Body limit: 10mb</text>

  <!-- Routes -->
  <rect x="620" y="170" width="260" height="155" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1" opacity="0.8"/>
  <text x="750" y="192" text-anchor="middle" fill="#a7f3d0" font-size="12" font-weight="600">API ROUTES</text>
  <text x="640" y="215" fill="#d1fae5" font-size="11">/api/endpoints</text>
  <text x="640" y="235" fill="#d1fae5" font-size="11">/api/collections</text>
  <text x="640" y="255" fill="#d1fae5" font-size="11">/api/schedules</text>
  <text x="640" y="275" fill="#d1fae5" font-size="11">/api/validation-rules</text>
  <text x="640" y="295" fill="#d1fae5" font-size="11">/api/results</text>
  <text x="640" y="315" fill="#d1fae5" font-size="11">/api/dashboard</text>

  <!-- Services -->
  <rect x="900" y="170" width="250" height="155" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1" opacity="0.8"/>
  <text x="1025" y="192" text-anchor="middle" fill="#a7f3d0" font-size="12" font-weight="600">SERVICES</text>
  <text x="920" y="215" fill="#d1fae5" font-size="11">apiExecution.ts</text>
  <text x="930" y="232" fill="#6ee7b7" font-size="9">HTTP client (localhost TLS bypass)</text>
  <text x="920" y="252" fill="#d1fae5" font-size="11">validation.ts</text>
  <text x="930" y="269" fill="#6ee7b7" font-size="9">Rule evaluation engine</text>
  <text x="920" y="289" fill="#d1fae5" font-size="11">scheduleRunner.ts</text>
  <text x="930" y="306" fill="#6ee7b7" font-size="9">Background scheduler (1s tick)</text>
  <text x="920" y="318" fill="#d1fae5" font-size="11">exportImport.ts</text>

  <!-- Middleware -->
  <rect x="620" y="340" width="530" height="40" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1" opacity="0.8"/>
  <text x="885" y="365" text-anchor="middle" fill="#d1fae5" font-size="11">Middleware: cors() | express.json({ limit: '10mb' }) | Route handlers</text>

  <!-- Health check -->
  <rect x="620" y="395" width="530" height="35" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1" opacity="0.6"/>
  <text x="885" y="417" text-anchor="middle" fill="#d1fae5" font-size="11">GET /api/health → { status: 'ok' }</text>

  <!-- Execution flow -->
  <rect x="620" y="445" width="530" height="70" rx="10" fill="#022c22" stroke="#34d399" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="885" y="467" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="600">EXECUTION FLOW</text>
  <text x="885" y="487" text-anchor="middle" fill="#a7f3d0" font-size="10">ScheduleRunner → Find due endpoints → Execute HTTP → Validate rules → Save result</text>
  <text x="885" y="503" text-anchor="middle" fill="#a7f3d0" font-size="10">Max 5 concurrent | 30s timeout | Localhost: node:https (rejectUnauthorized: false)</text>

  <!-- Types -->
  <rect x="620" y="530" width="530" height="30" rx="8" fill="#022c22" stroke="#059669" stroke-width="1" opacity="0.6"/>
  <text x="885" y="550" text-anchor="middle" fill="#6ee7b7" font-size="10">server/types.ts — ApiEndpoint | ExecutionResult | ExportPayload | ImportPayload</text>

  <!-- Entry point -->
  <rect x="620" y="575" width="530" height="30" rx="8" fill="#022c22" stroke="#059669" stroke-width="1" opacity="0.6"/>
  <text x="885" y="595" text-anchor="middle" fill="#6ee7b7" font-size="10">server/index.ts — Express app entry | app.listen(10021) | startScheduler()</text>

  <!-- ==================== DATABASE SECTION ==================== -->
  <g filter="url(#shadow)">
    <rect x="30" y="660" width="520" height="210" rx="16" fill="#451a03" stroke="#d97706" stroke-width="2" opacity="0.95"/>
  </g>
  <rect x="30" y="660" width="520" height="44" rx="16" fill="url(#dbGrad)"/>
  <rect x="30" y="688" width="520" height="16" fill="url(#dbGrad)"/>
  <text x="290" y="688" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">DATABASE — SQLite (better-sqlite3)</text>
  <text x="290" y="715" text-anchor="middle" fill="#fbbf24" font-size="11">lithium.db | WAL mode | Synchronous I/O</text>

  <!-- Tables -->
  <rect x="50" y="730" width="150" height="120" rx="8" fill="#78350f" stroke="#f59e0b" stroke-width="1" opacity="0.8"/>
  <text x="125" y="752" text-anchor="middle" fill="#fde68a" font-size="11" font-weight="600">ApiEndpoints</text>
  <text x="65" y="770" fill="#fef3c7" font-size="9">Id, CollectionId, Name</text>
  <text x="65" y="784" fill="#fef3c7" font-size="9">Method, Url, Headers</text>
  <text x="65" y="798" fill="#fef3c7" font-size="9">Body, BodyType, AuthType</text>
  <text x="65" y="812" fill="#fef3c7" font-size="9">AuthConfig, CreatedAt</text>
  <text x="65" y="826" fill="#fef3c7" font-size="9">UpdatedAt, Description</text>

  <rect x="215" y="730" width="130" height="120" rx="8" fill="#78350f" stroke="#f59e0b" stroke-width="1" opacity="0.8"/>
  <text x="280" y="752" text-anchor="middle" fill="#fde68a" font-size="11" font-weight="600">Collections</text>
  <text x="230" y="770" fill="#fef3c7" font-size="9">Id, Name</text>
  <text x="230" y="784" fill="#fef3c7" font-size="9">Description</text>
  <text x="230" y="798" fill="#fef3c7" font-size="9">CreatedAt</text>
  <text x="230" y="812" fill="#fef3c7" font-size="9">UpdatedAt</text>

  <rect x="360" y="730" width="170" height="120" rx="8" fill="#78350f" stroke="#f59e0b" stroke-width="1" opacity="0.8"/>
  <text x="445" y="752" text-anchor="middle" fill="#fde68a" font-size="11" font-weight="600">Schedules</text>
  <text x="375" y="770" fill="#fef3c7" font-size="9">Id, ApiEndpointId</text>
  <text x="375" y="784" fill="#fef3c7" font-size="9">IsEnabled, IntervalSeconds</text>
  <text x="375" y="798" fill="#fef3c7" font-size="9">LastRunAt, NextRunAt</text>
  <text x="375" y="812" fill="#fef3c7" font-size="9">CreatedAt, UpdatedAt</text>

  <!-- More tables row -->
  <rect x="50" y="860" width="220" height="0" rx="0" fill="none"/>

  <!-- ==================== EXTERNAL APIs SECTION ==================== -->
  <g filter="url(#shadow)">
    <rect x="600" y="660" width="570" height="210" rx="16" fill="#172554" stroke="#2563eb" stroke-width="2" opacity="0.95"/>
  </g>
  <rect x="600" y="660" width="570" height="44" rx="16" fill="url(#externalGrad)"/>
  <rect x="600" y="688" width="570" height="16" fill="url(#externalGrad)"/>
  <text x="885" y="688" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">EXTERNAL APIs — Target Endpoints</text>
  <text x="885" y="715" text-anchor="middle" fill="#93c5fd" font-size="11">HTTP/HTTPS endpoints being tested and monitored</text>

  <!-- API examples -->
  <rect x="620" y="730" width="250" height="55" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1" opacity="0.8"/>
  <text x="745" y="752" text-anchor="middle" fill="#bfdbfe" font-size="11" font-weight="600">Local Dev Servers</text>
  <text x="745" y="772" text-anchor="middle" fill="#93c5fd" font-size="10">https://localhost:{port}</text>
  <text x="745" y="785" text-anchor="middle" fill="#60a5fa" font-size="9">Self-signed certs supported</text>

  <rect x="890" y="730" width="260" height="55" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1" opacity="0.8"/>
  <text x="1020" y="752" text-anchor="middle" fill="#bfdbfe" font-size="11" font-weight="600">Remote APIs</text>
  <text x="1020" y="772" text-anchor="middle" fill="#93c5fd" font-size="10">https://api.example.com/...</text>
  <text x="1020" y="785" text-anchor="middle" fill="#60a5fa" font-size="9">Strict TLS verification</text>

  <!-- Auth methods -->
  <rect x="620" y="800" width="530" height="55" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1" opacity="0.6"/>
  <text x="885" y="822" text-anchor="middle" fill="#bfdbfe" font-size="11" font-weight="600">SUPPORTED AUTH METHODS</text>
  <text x="885" y="842" text-anchor="middle" fill="#93c5fd" font-size="10">None | Bearer Token | Basic Auth | API Key (Header/Query) | OAuth 2.0</text>

  <!-- ==================== ARROWS / DATA FLOW ==================== -->

  <!-- Frontend → Backend (API calls) -->
  <line x1="550" y1="480" x2="600" y2="480" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrowWhite)"/>
  <text x="575" y="470" text-anchor="middle" fill="#94a3b8" font-size="9" font-weight="600">/api/*</text>

  <!-- Backend → Database -->
  <path d="M 750 615 L 750 640 L 290 640 L 290 660" stroke="#fbbf24" stroke-width="2.5" fill="none" marker-end="url(#arrowYellow)"/>
  <text x="520" y="635" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="600">SQLite queries</text>

  <!-- Backend → External APIs -->
  <path d="M 1025 615 L 1025 640 L 885 640 L 885 660" stroke="#60a5fa" stroke-width="2.5" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="960" y="635" text-anchor="middle" fill="#60a5fa" font-size="9" font-weight="600">HTTP requests</text>

  <!-- External APIs → Backend (response) -->
  <path d="M 850 660 L 850 645 L 990 645 L 990 615" stroke="#34d399" stroke-width="2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrowGreen)"/>
  <text x="920" y="655" text-anchor="middle" fill="#34d399" font-size="8">responses</text>

  <!-- Database → Backend (results) -->
  <path d="M 350 660 L 350 645 L 700 645 L 700 615" stroke="#fbbf24" stroke-width="2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrowYellow)"/>
  <text x="525" y="653" text-anchor="middle" fill="#fbbf24" font-size="8">results</text>

  <!-- ==================== LEGEND ==================== -->
  <rect x="30" y="880" width="1140" height="15" rx="4" fill="none"/>
  <circle cx="60" cy="888" r="4" fill="#7c3aed"/>
  <text x="72" y="892" fill="#94a3b8" font-size="9">Frontend</text>
  <circle cx="160" cy="888" r="4" fill="#059669"/>
  <text x="172" y="892" fill="#94a3b8" font-size="9">Backend</text>
  <circle cx="260" cy="888" r="4" fill="#d97706"/>
  <text x="272" y="892" fill="#94a3b8" font-size="9">Database</text>
  <circle cx="370" cy="888" r="4" fill="#2563eb"/>
  <text x="382" y="892" fill="#94a3b8" font-size="9">External APIs</text>
  <line x1="490" y1="888" x2="520" y2="888" stroke="#94a3b8" stroke-width="2"/>
  <text x="530" y="892" fill="#94a3b8" font-size="9">Request flow</text>
  <line x1="630" y1="888" x2="660" y2="888" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="670" y="892" fill="#94a3b8" font-size="9">Response flow</text>
</svg>