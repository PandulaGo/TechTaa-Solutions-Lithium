<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <linearGradient id="box1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#6d28d9"/>
    </linearGradient>
    <linearGradient id="box2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="box3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#047857"/>
    </linearGradient>
    <linearGradient id="box4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d97706"/>
      <stop offset="100%" style="stop-color:#b45309"/>
    </linearGradient>
    <linearGradient id="box5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626"/>
      <stop offset="100%" style="stop-color:#b91c1c"/>
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" fill="#f9fafb"/>
  <rect x="0" y="0" width="1200" height="60" fill="#111827"/>
  <text x="600" y="38" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#a78bfa" text-anchor="middle">Lithium — System Architecture</text>

  <!-- Frontend box -->
  <rect x="50" y="100" width="240" height="120" rx="10" fill="url(#box1)"/>
  <text x="170" y="135" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Frontend</text>
  <text x="170" y="158" font-family="Arial, sans-serif" font-size="12" fill="#e9d5ff" text-anchor="middle">React 19 + TypeScript</text>
  <text x="170" y="178" font-family="Arial, sans-serif" font-size="12" fill="#e9d5ff" text-anchor="middle">Vite Dev Server</text>
  <text x="170" y="198" font-family="Arial, sans-serif" font-size="12" fill="#e9d5ff" text-anchor="middle">Port :10025</text>

  <!-- Vite proxy box -->
  <rect x="350" y="100" width="200" height="120" rx="10" fill="url(#box2)"/>
  <text x="450" y="135" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Vite Proxy</text>
  <text x="450" y="158" font-family="Arial, sans-serif" font-size="12" fill="#bfdbfe" text-anchor="middle">/api/* → localhost:10021</text>
  <text x="450" y="178" font-family="Arial, sans-serif" font-size="12" fill="#bfdbfe" text-anchor="middle">CORS Enabled</text>
  <text x="450" y="198" font-family="Arial, sans-serif" font-size="12" fill="#bfdbfe" text-anchor="middle">JSON 10MB Limit</text>

  <!-- Express API box -->
  <rect x="610" y="100" width="240" height="120" rx="10" fill="url(#box3)"/>
  <text x="730" y="135" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Express API</text>
  <text x="730" y="158" font-family="Arial, sans-serif" font-size="12" fill="#d1fae5" text-anchor="middle">Express v5 + TypeScript</text>
  <text x="730" y="178" font-family="Arial, sans-serif" font-size="12" fill="#d1fae5" text-anchor="middle">Port :10021</text>
  <text x="730" y="198" font-family="Arial, sans-serif" font-size="12" fill="#d1fae5" text-anchor="middle">RESTful Routes</text>

  <!-- SQLite box -->
  <rect x="910" y="100" width="240" height="120" rx="10" fill="url(#box4)"/>
  <text x="1030" y="135" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">SQLite Database</text>
  <text x="1030" y="158" font-family="Arial, sans-serif" font-size="12" fill="#fef3c7" text-anchor="middle">better-sqlite3 v12</text>
  <text x="1030" y="178" font-family="Arial, sans-serif" font-size="12" fill="#fef3c7" text-anchor="middle">WAL Journal Mode</text>
  <text x="1030" y="198" font-family="Arial, sans-serif" font-size="12" fill="#fef3c7" text-anchor="middle">lithium.db</text>

  <!-- Arrows -->
  <line x1="290" y1="160" x2="345" y2="160" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="550" y1="160" x2="605" y2="160" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="850" y1="160" x2="905" y2="160" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Services section -->
  <text x="600" y="280" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">Background Services</text>

  <!-- Schedule Runner -->
  <rect x="50" y="300" width="240" height="100" rx="10" fill="url(#box5)"/>
  <text x="170" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Schedule Runner</text>
  <text x="170" y="352" font-family="Arial, sans-serif" font-size="11" fill="#fecaca" text-anchor="middle">1-second tick interval</text>
  <text x="170" y="370" font-family="Arial, sans-serif" font-size="11" fill="#fecaca" text-anchor="middle">Max 5 concurrent runs</text>
  <text x="170" y="388" font-family="Arial, sans-serif" font-size="11" fill="#fecaca" text-anchor="middle">Executes due schedules</text>

  <!-- API Execution -->
  <rect x="350" y="300" width="240" height="100" rx="10" fill="url(#box2)"/>
  <text x="470" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">API Execution</text>
  <text x="470" y="352" font-family="Arial, sans-serif" font-size="11" fill="#bfdbfe" text-anchor="middle">Localhost: http/https</text>
  <text x="470" y="370" font-family="Arial, sans-serif" font-size="11" fill="#bfdbfe" text-anchor="middle">Remote: fetch() 30s</text>
  <text x="470" y="388" font-family="Arial, sans-serif" font-size="11" fill="#bfdbfe" text-anchor="middle">Variable interpolation</text>

  <!-- Validation -->
  <rect x="650" y="300" width="240" height="100" rx="10" fill="url(#box3)"/>
  <text x="770" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Validation Engine</text>
  <text x="770" y="352" font-family="Arial, sans-serif" font-size="11" fill="#d1fae5" text-anchor="middle">Status Code</text>
  <text x="770" y="370" font-family="Arial, sans-serif" font-size="11" fill="#d1fae5" text-anchor="middle">JSON Path / Body Contains</text>
  <text x="770" y="388" font-family="Arial, sans-serif" font-size="11" fill="#d1fae5" text-anchor="middle">Response Time / Headers</text>

  <!-- Export/Import -->
  <rect x="950" y="300" width="200" height="100" rx="10" fill="url(#box4)"/>
  <text x="1050" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Export / Import</text>
  <text x="1050" y="352" font-family="Arial, sans-serif" font-size="11" fill="#fef3c7" text-anchor="middle">JSON payload</text>
  <text x="1050" y="370" font-family="Arial, sans-serif" font-size="11" fill="#fef3c7" text-anchor="middle">Endpoints + Schedules</text>
  <text x="1050" y="388" font-family="Arial, sans-serif" font-size="11" fill="#fef3c7" text-anchor="middle">+ Validation Rules</text>

  <!-- Data flow labels -->
  <text x="317" y="150" font-family="Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">HTTP</text>
  <text x="577" y="150" font-family="Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">HTTP</text>
  <text x="877" y="150" font-family="Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">SQL</text>

  <!-- Bottom info -->
  <rect x="50" y="430" width="1100" height="50" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="600" y="452" font-family="Arial, sans-serif" font-size="12" fill="#374151" text-anchor="middle">Data Flow: React → Vite Proxy → Express Router → better-sqlite3 → SQLite (WAL) → Response</text>
  <text x="600" y="470" font-family="Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">No authentication — designed for local/trusted-network use only</text>
</svg>
